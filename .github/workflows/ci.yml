name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v2
        with:
          languages: javascript,python
      - uses: github/codeql-action/autobuild@v2
        continue-on-error: true
      - uses: github/codeql-action/analyze@v2

  build-test-lint:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    needs: codeql
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies (Node)
        run: |
          if [ -f package.json ]; then npm ci; fi
      - name: Build
        run: |
          if [ -f package.json ] && npm run | grep -q build; then npm run build; else echo "No build step"; fi
      - name: Run tests
        run: |
          if [ -f package.json ]; then npm test --silent || true
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then pip install -r requirements.txt || true; pytest -q || true
          else echo "No tests configured"; fi
      - name: Lint
        run: |
          if [ -f package.json ] && npm run | grep -q lint; then npm run lint || true
          elif command -v flake8 >/dev/null 2>&1; then flake8 . || true
          else echo "No lint configured"; fi
